<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 196" role="img" aria-labelledby="title desc">
<title id="title">SIEVE: leave the object where it is</title>
<desc id="desc">A single queue with one visited bit per object. An animated hand slides from the tail toward the head, pausing on each object: an unvisited object fades out where it stands (evicted), while a visited object trades its green check for an empty marker (bit cleared) and stays in place. The hand never rewinds to the tail between evictions; it carries its position forward and wraps only after reaching the head.</desc>
<style>
  .ink-1 { fill: #171816; }
  .ink-2 { fill: #52514e; }
  .muted { fill: #898781; }
  .box   { fill: #e9e6dc; stroke: #cbc8bc; stroke-width: 1.5; }
  .ring  { fill: none; stroke: #898781; stroke-width: 2.2; }
  .chk   { stroke: #ffffff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .s1 { stroke: #2a78d6; } .f1 { fill: #2a78d6; }
  .f2 { fill: #1baf7a; }
  .s4 { stroke: #e8502c; } .f4 { fill: #e8502c; }
  .dot { stroke: #e9e6dc; stroke-width: 1.8; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    .ink-1 { fill: #efeee8; }
    .ink-2 { fill: #c3c2b7; }
    .muted { fill: #8f8e87; }
    .box   { fill: #1d211f; stroke: #393c38; }
    .ring  { stroke: #8f8e87; }
    .s1 { stroke: #3987e5; } .f1 { fill: #3987e5; }
    .f2 { fill: #199e70; }
    .s4 { stroke: #ff6841; } .f4 { fill: #ff6841; }
    .dot { stroke: #1d211f; }
  }
</style>
<defs>
  <marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f1"/></marker>
</defs>

<text x="20" y="28" font-size="16" font-weight="600" class="ink-1">SIEVE: leave the object where it is</text>
<text x="20" y="46" font-size="12.5" class="ink-2">One queue. The hand holds its position between evictions instead of rescanning from the tail.</text>

<line x1="20" y1="124" x2="76" y2="124" class="s1" stroke-width="2.3" marker-end="url(#ah-blue)"/>
<text x="48" y="108" font-size="10.5" text-anchor="middle" class="f1">new</text>
<circle cx="20" cy="124" r="4.5" class="f1 dot" opacity="0">
  <animateMotion calcMode="linear" dur="3s" repeatCount="indefinite" path="M0,0 L90,0" keyPoints="0;1;1" keyTimes="0;0.45;1"/>
  <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.38;0.45;1" dur="3s" repeatCount="indefinite"/>
</circle>
<rect x="84" y="96" width="52" height="56" rx="6" class="box"/>
<rect x="146" y="96" width="52" height="56" rx="6" class="box"/>
<rect x="208" y="96" width="52" height="56" rx="6" class="box"/>
<rect x="270" y="96" width="52" height="56" rx="6" class="box"/>
<rect x="332" y="96" width="52" height="56" rx="6" class="box"/>
<rect x="394" y="96" width="52" height="56" rx="6" class="box"/>

<!-- objects; the hand's 9s sweep drives every state change below.
     hand schedule: 420 (t=0) / 358 (t=1.5) / 296 (t=3) / 234 (t=4.5) / 172 (t=6) / 110 (t=7.5), wrap at 9s -->
<circle cx="110" cy="124" r="9" class="ring">
  <animate attributeName="opacity" calcMode="discrete" values="1;0.15;1" keyTimes="0;0.86;0.97" dur="9s" repeatCount="indefinite"/>
</circle>
<!-- visited object: green check clears to an empty marker when the hand passes at t=6s -->
<circle cx="172" cy="124" r="9" class="ring" opacity="0">
  <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.70;0.97" dur="9s" repeatCount="indefinite"/>
</circle>
<g>
  <animate attributeName="opacity" calcMode="discrete" values="1;0;1" keyTimes="0;0.70;0.97" dur="9s" repeatCount="indefinite"/>
  <circle cx="172" cy="124" r="9" class="f2"/><path d="M167.5,124 L170.5,127.5 L176,120.5" class="chk"/>
</g>
<circle cx="234" cy="124" r="9" class="ring">
  <animate attributeName="opacity" calcMode="discrete" values="1;0.15;1" keyTimes="0;0.53;0.97" dur="9s" repeatCount="indefinite"/>
</circle>
<!-- visited object: cleared when the hand passes at t=3s -->
<circle cx="296" cy="124" r="9" class="ring" opacity="0">
  <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.37;0.97" dur="9s" repeatCount="indefinite"/>
</circle>
<g>
  <animate attributeName="opacity" calcMode="discrete" values="1;0;1" keyTimes="0;0.37;0.97" dur="9s" repeatCount="indefinite"/>
  <circle cx="296" cy="124" r="9" class="f2"/><path d="M291.5,124 L294.5,127.5 L300,120.5" class="chk"/>
</g>
<circle cx="358" cy="124" r="9" class="ring">
  <animate attributeName="opacity" calcMode="discrete" values="1;0.15;1" keyTimes="0;0.20;0.97" dur="9s" repeatCount="indefinite"/>
</circle>
<circle cx="420" cy="124" r="9" class="ring">
  <animate attributeName="opacity" calcMode="discrete" values="1;0.15;1" keyTimes="0;0.06;0.97" dur="9s" repeatCount="indefinite"/>
</circle>
<text x="110" y="172" font-size="10" text-anchor="middle" class="muted">head</text>
<text x="420" y="172" font-size="10" text-anchor="middle" class="muted">tail</text>

<!-- the hand: slides from the tail toward the head, pausing on each object, then wraps.
     Drawn at x=296; translate offsets land it on each box center. -->
<g>
  <animateTransform attributeName="transform" type="translate"
    values="124 0;124 0;62 0;62 0;0 0;0 0;-62 0;-62 0;-124 0;-124 0;-186 0;-186 0"
    keyTimes="0;0.133;0.167;0.30;0.333;0.467;0.5;0.633;0.667;0.80;0.833;1"
    dur="9s" repeatCount="indefinite"/>
  <text x="296" y="70" font-size="11" font-weight="700" text-anchor="middle" class="f4">hand</text>
  <path d="M296,82 L296,96" class="s4" stroke-width="2.4"/>
  <path d="M285,76 L296,86 L307,76" class="s4" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<text x="480" y="116" font-size="10.5" class="ink-2">visited &#8594; clear the bit, leave the object in place, step toward the head</text>
<text x="480" y="132" font-size="10.5" class="ink-2">not visited &#8594; evict here; the hand keeps this position for the next eviction</text>
</svg>
