<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
<title id="title">S3-FIFO: filter first, protect later</title>
<desc id="desc">Three queues. A small queue filters new objects, dropping one-hit objects and promoting reused ones to a larger main queue. A ghost queue remembers the keys of dropped objects so a late repeat request can skip straight into the main queue. The animation plays this as a repeating story: an object enters the small queue, is requested again, and is promoted to main; a second object enters, is never reused, drops to the ghost queue; when its key is requested again it enters the main queue directly.</desc>
<style>
  .ink-1 { fill: #171816; }
  .ink-2 { fill: #52514e; }
  .muted { fill: #898781; }
  .box   { fill: #e9e6dc; stroke: #cbc8bc; stroke-width: 1.5; }
  .ghost  { fill: #e9e6dc; stroke: #cbc8bc; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .ring  { fill: none; stroke: #898781; stroke-width: 2.2; }
  .chk   { stroke: #ffffff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .s1 { stroke: #2a78d6; } .f1 { fill: #2a78d6; }
  .s2 { stroke: #1baf7a; } .f2 { fill: #1baf7a; }
  .s4 { stroke: #e8502c; } .f4 { fill: #e8502c; }
  .s5 { stroke: #b8862f; } .f5 { fill: #b8862f; }
  .smut { stroke: #898781; }
  .dot { stroke: #e9e6dc; stroke-width: 1.8; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    .ink-1 { fill: #efeee8; }
    .ink-2 { fill: #c3c2b7; }
    .muted { fill: #8f8e87; }
    .box   { fill: #1d211f; stroke: #393c38; }
    .ghost  { fill: #1d211f; stroke: #393c38; }
    .ring  { stroke: #8f8e87; }
    .s1 { stroke: #3987e5; } .f1 { fill: #3987e5; }
    .s2 { stroke: #199e70; } .f2 { fill: #199e70; }
    .s4 { stroke: #ff6841; } .f4 { fill: #ff6841; }
    .s5 { stroke: #d6a13f; } .f5 { fill: #d6a13f; }
    .smut { stroke: #8f8e87; }
    .dot { stroke: #1d211f; }
  }
</style>
<defs>
  <marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f1"/></marker>
  <marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f2"/></marker>
  <marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f4"/></marker>
  <marker id="ah-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f5"/></marker>
  <marker id="ah-scan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
</defs>

<text x="20" y="28" font-size="16" font-weight="600" class="ink-1">S3-FIFO: filter first, protect later</text>
<text x="20" y="48" font-size="12.5" class="ink-2">Three queues: a small filter, a ghost of what it dropped, and a larger main queue.</text>

<!-- small queue S -->
<text x="34" y="70" font-size="11.5" font-weight="600" class="ink-2">small queue (S) &#8212; ~10% of capacity</text>
<line x1="20" y1="120" x2="76" y2="120" class="s1" stroke-width="2.3" marker-end="url(#ah-blue)"/>
<text x="48" y="104" font-size="10.5" text-anchor="middle" class="f1">new</text>
<rect x="84" y="92" width="52" height="56" rx="6" class="box"/>
<rect x="146" y="92" width="52" height="56" rx="6" class="box"/>
<rect x="208" y="92" width="52" height="56" rx="6" class="box"/>
<circle cx="110" cy="120" r="9" class="ring"/>
<g><circle cx="172" cy="120" r="9" class="f2"><animate attributeName="r" values="9;11.5;9" dur="0.6s" begin="b1.end+0.15s"/></circle><path d="M167.5,120 L170.5,123.5 L176,116.5" class="chk"/></g>
<circle cx="234" cy="120" r="9" class="ring"/>
<text x="234" y="164" font-size="10" text-anchor="middle" class="muted">tail</text>

<!-- promote arrow, arcing well clear of the subtitle -->
<path d="M262,108 C 340,66 560,66 638,108" class="s2" fill="none" stroke-width="2.2" marker-end="url(#ah-green)"/>
<text x="450" y="84" font-size="10.5" text-anchor="middle" class="f2">reused &#8594; promote to main</text>

<!-- one-hit arrow down into the ghost queue -->
<path d="M262,138 C 280,160 292,182 302,202" class="s4" fill="none" stroke-width="2.2" marker-end="url(#ah-red)"/>
<text x="150" y="188" font-size="10.5" class="f4">one-hit &#8594; drop, keep only its key</text>

<!-- ghost queue G -->
<rect x="316" y="206" width="34" height="40" rx="4" class="ghost">
  <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.4;1" dur="0.6s" begin="r1.end"/>
</rect>
<rect x="356" y="206" width="34" height="40" rx="4" class="ghost"/>
<rect x="396" y="206" width="34" height="40" rx="4" class="ghost"/>
<rect x="436" y="206" width="34" height="40" rx="4" class="ghost"/>
<text x="380" y="190" font-size="11.5" font-weight="600" class="ink-2">ghost queue (G) &#8212; keys only, no data</text>

<!-- ghost hit -> straight into main, skipping S -->
<path d="M474,206 C 525,146 582,132 662,146" class="s5" fill="none" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#ah-gold)"/>
<text x="555" y="157" font-size="10.5" class="f5" text-anchor="middle">ghost hit &#8594;</text>
<text x="555" y="170" font-size="10.5" class="f5" text-anchor="middle">insert into main, skip S</text>

<!-- main queue M -->
<text x="640" y="70" font-size="11.5" font-weight="600" class="ink-2">main queue (M) &#8212; the rest of the cache</text>
<rect x="640" y="92" width="52" height="56" rx="6" class="box"/>
<rect x="702" y="92" width="52" height="56" rx="6" class="box"/>
<rect x="764" y="92" width="52" height="56" rx="6" class="box"/>
<rect x="826" y="92" width="52" height="56" rx="6" class="box"/>
<text x="666" y="164" font-size="10" text-anchor="middle" class="muted">head</text>
<g><circle cx="666" cy="120" r="9" class="f2"><animate attributeName="r" values="9;11.5;9" dur="0.6s" begin="p1.end; g1.end"/></circle><path d="M661.5,120 L664.5,123.5 L670,116.5" class="chk"/></g>
<circle cx="728" cy="120" r="9" class="ring"/>
<g><circle cx="790" cy="120" r="9" class="f2"/><path d="M785.5,120 L788.5,123.5 L794,116.5" class="chk"/></g>
<circle cx="852" cy="120" r="9" class="ring"/>
<text x="852" y="164" font-size="10" text-anchor="middle" class="muted">tail</text>

<!-- main's own reinsertion loop off the tail -->
<line x1="878" y1="120" x2="924" y2="120" class="smut" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#ah-scan)"/>
<text x="901" y="104" font-size="10.5" text-anchor="middle" class="muted">checked</text>
<text x="930" y="140" font-size="10" text-anchor="end" class="muted">reused &#8594; reinserted</text>
<text x="930" y="154" font-size="10" text-anchor="end" class="muted">freq 0 &#8594; evicted</text>
<circle cx="878" cy="120" r="4" class="muted dot" opacity="0">
  <animateMotion dur="2s" begin="0.8s" repeatCount="indefinite" path="M0,0 L46,0"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
</circle>

<!-- ============ the story, told by traveling dots ============
     b1: object A enters S            (loops via g1.end)
     sPulse: A gets a hit while in S  (b1.end)
     p1: A is promoted to main        (b1.end + pause)
     b2: object B enters S            (p1.end + pause)
     r1: B was never reused; its key drops into the ghost queue
     g1: B's key is requested again; it goes straight into main -->
<circle cx="20" cy="120" r="4.5" class="f1 dot" opacity="0">
  <animateMotion id="b1" begin="0s; g1.end+1.4s" dur="1.3s" path="M0,0 L90,0"/>
  <animate attributeName="opacity" begin="b1.begin" dur="1.3s" values="0;1;1;0" keyTimes="0;0.12;0.85;1"/>
</circle>
<circle cx="262" cy="108" r="4.5" class="f2 dot" opacity="0">
  <animateMotion id="p1" begin="b1.end+0.7s" dur="1.7s" path="M0,0 C 78,-42 298,-42 376,0 L 404,12"/>
  <animate attributeName="opacity" begin="p1.begin" dur="1.7s" values="0;1;1;0" keyTimes="0;0.1;0.88;1"/>
</circle>
<circle cx="20" cy="120" r="4.5" class="f1 dot" opacity="0">
  <animateMotion id="b2" begin="p1.end+0.6s" dur="1.3s" path="M0,0 L90,0"/>
  <animate attributeName="opacity" begin="b2.begin" dur="1.3s" values="0;1;1;0" keyTimes="0;0.12;0.85;1"/>
</circle>
<circle cx="262" cy="138" r="4.5" class="f4 dot" opacity="0">
  <animateMotion id="r1" begin="b2.end+0.7s" dur="1.4s" path="M0,0 C 18,22 30,44 40,64 L 71,88"/>
  <animate attributeName="opacity" begin="r1.begin" dur="1.4s" values="0;1;1;0" keyTimes="0;0.12;0.85;1"/>
</circle>
<circle cx="474" cy="206" r="4.5" class="f5 dot" opacity="0">
  <animateMotion id="g1" begin="r1.end+1.1s" dur="1.7s" path="M0,0 C 51,-60 108,-74 188,-60 L 192,-86"/>
  <animate attributeName="opacity" begin="g1.begin" dur="1.7s" values="0;1;1;0" keyTimes="0;0.1;0.88;1"/>
</circle>
</svg>
