    <path class="route" data-color="yellow" d="M324 182 C324 207 92 217 92 244" stroke="#e7bd38" marker-end="url(#arrow-yellow)" />
    <path class="route" data-color="yellow" d="M324 182 C324 207 216 217 216 244" stroke="#e7bd38" marker-end="url(#arrow-yellow)" />
    <path class="route" data-color="yellow" d="M324 182 C324 207 340 217 340 244" stroke="#e7bd38" marker-end="url(#arrow-yellow)" />
    <g data-server="1">
