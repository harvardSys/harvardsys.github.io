      <rect class="prefix-block" data-block="purple-5" x="288" y="342" width="33" height="18" rx="2" fill="#8b6bb1" />
      <rect class="prefix-block" data-block="purple-6" x="327" y="342" width="33" height="18" rx="2" fill="#8b6bb1" />
      <rect class="prefix-block" data-block="yellow-1" x="288" y="318" width="33" height="18" rx="2" fill="#e7bd38" />
      <rect class="prefix-block" data-block="yellow-2" x="327" y="318" width="33" height="18" rx="2" fill="#e7bd38" />
    </g>
    <text class="label" x="200" y="503" text-anchor="middle">Duplication · lower hit rate</text>
  </g>
