      <text x="324" y="282" font-size="18" text-anchor="middle">Server 3</text>
      <rect class="prefix-block" data-block="yellow-1" x="288" y="438" width="33" height="18" rx="2" fill="#e7bd38" />
      <rect class="prefix-block" data-block="yellow-2" x="327" y="438" width="33" height="18" rx="2" fill="#e7bd38" />
