    <path class="route" data-color="purple" d="M200 182 C200 207 200 217 200 244" stroke="#8b6bb1" marker-end="url(#arrow-purple)" />
    <path class="route" data-color="purple" d="M200 182 C200 207 324 217 324 244" stroke="#8b6bb1" marker-end="url(#arrow-purple)" />
