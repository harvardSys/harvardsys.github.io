      <rect class="prefix-block" data-block="blue-1" x="288" y="438" width="33" height="18" rx="2" fill="#4c78a8" />
      <rect class="prefix-block" data-block="blue-2" x="327" y="438" width="33" height="18" rx="2" fill="#4c78a8" />
