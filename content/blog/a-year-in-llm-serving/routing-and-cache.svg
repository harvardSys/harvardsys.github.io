<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc">
  <title id="title">Round robin, sticky routing, and cache-aware routing</title>
  <desc id="desc">Each color represents a session. Purple has the largest prefix, blue an intermediate prefix, and yellow the smallest. Round robin spreads every request across servers and duplicates prefixes. Sticky routing pins every session to one server. Cache-aware routing pins sessions to cached prefixes but spreads work when load becomes imbalanced. Here only the heavy purple session is spread, replicating its shared prefix while distributing its branches.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202623; }
    .heading { font-size: 25px; font-weight: 600; }
    .label { font-size: 19px; }
    .server { fill: #fff; stroke: #9ca3af; stroke-width: 1.5; }
    .route { fill: none; stroke-width: 2.3; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="#4c78a8" />
    </marker>
    <marker id="arrow-purple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="#8b6bb1" />
    </marker>
    <marker id="arrow-yellow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="#e7bd38" />
    </marker>
  </defs>
  <rect width="1200" height="525" fill="#fff" />
  <line x1="400" y1="48" x2="400" y2="513" stroke="#e5e7eb" />
  <line x1="800" y1="48" x2="800" y2="513" stroke="#e5e7eb" />
  <g data-policy="0" transform="translate(0 0)">
    <text class="heading" x="200" y="66" text-anchor="middle">Round robin</text>
    <text class="label" x="200" y="98" text-anchor="middle">Spread every request</text>
    <text x="200" y="132" font-size="17" text-anchor="middle">Requests</text>
    <rect class="request" x="51" y="146" width="50" height="30" rx="4" fill="#4c78a8" />
    <path class="route" data-color="blue" d="M76 182 C76 207 60 217 60 244" stroke="#4c78a8" marker-end="url(#arrow-blue)" />
    <path class="route" data-color="blue" d="M76 182 C76 207 184 217 184 244" stroke="#4c78a8" marker-end="url(#arrow-blue)" />
    <path class="route" data-color="blue" d="M76 182 C76 207 308 217 308 244" stroke="#4c78a8" marker-end="url(#arrow-blue)" />
    <rect class="request" x="175" y="146" width="50" height="30" rx="4" fill="#8b6bb1" />
