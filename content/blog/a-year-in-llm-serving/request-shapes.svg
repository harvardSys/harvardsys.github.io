<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
  <title id="title">Different request shapes need different serving optimizations</title>
  <desc id="desc">Illustrative bars compare long inputs and short outputs for MiniMax-M2.5 with relatively shorter inputs and long outputs for DeepSeek-R1. Bar lengths are schematic, not measured token counts.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bg { fill: #f2f0e9; } .panel { fill: #e8e5dc; }
    .ink { fill: #202623; } .muted { fill: #62645d; }
    .input { fill: #2d7a6c; } .output { fill: #c74d2f; }
  </style>
  <rect class="bg" width="900" height="450" rx="12"/>
  <text class="ink" x="36" y="49" font-size="27" font-weight="700">Request count misses the shape of the work</text>
  <rect class="input" x="36" y="76" width="16" height="16" rx="3"/>
  <text class="muted" x="61" y="90" font-size="16">Input / prefill</text>
  <rect class="output" x="224" y="76" width="16" height="16" rx="3"/>
  <text class="muted" x="249" y="90" font-size="16">Output / decode</text>
  <rect class="panel" x="36" y="120" width="828" height="122" rx="8"/>
  <text class="ink" x="58" y="154" font-size="21" font-weight="650">MiniMax-M2.5</text>
  <text class="muted" x="58" y="183" font-size="16">Coding and agents</text>
  <text class="muted" x="58" y="216" font-size="16">More prefill work</text>
  <rect class="input" x="300" y="148" width="510" height="27" rx="4"/>
  <rect class="output" x="300" y="190" width="90" height="27" rx="4"/>
  <rect class="panel" x="36" y="260" width="828" height="122" rx="8"/>
  <text class="ink" x="58" y="294" font-size="21" font-weight="650">DeepSeek-R1</text>
  <text class="muted" x="58" y="323" font-size="16">Reasoning</text>
  <text class="muted" x="58" y="356" font-size="16">More decode work</text>
  <rect class="input" x="300" y="288" width="195" height="27" rx="4"/>
  <rect class="output" x="300" y="330" width="430" height="27" rx="4"/>
  <text class="muted" x="36" y="421" font-size="15">Schematic profiles from the study · bar lengths are not measured token counts</text>
</svg>
